name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Dummy values used so `pnpm build` and the logged-out smoke E2E suite can run
# without provisioning real Supabase / Stripe / Resend credentials in CI. Do
# not put real secrets in workflow files; use repository or environment
# secrets instead.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-dummy-publishable-key
  SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  STRIPE_SECRET_KEY: sk_test_ci_dummy
  STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
  STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
  RESEND_API_KEY: re_ci_dummy
  RESEND_FROM_ADDRESS: Mentor IB <ci@mentorib.com>
  NEXT_PUBLIC_POSTHOG_KEY: phc_ci_dummy
  NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
  CRON_SECRET: ci-dummy-cron-secret

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architectural lint
        run: pnpm lint:arch

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
